name: Build Android Kotlin APK & Web App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build_apk:
    name: Build Native Android APK (Kotlin)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Kotlin APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Copy APK file
        run: |
          ls -la android/app/build/outputs/apk/debug/
          cp android/app/build/outputs/apk/debug/app-debug.apk ./archive-wage-app-kotlin.apk

      - name: Upload Android Kotlin APK
        uses: actions/upload-artifact@v4
        with:
          name: Archive-Wage-App-Kotlin-APK
          path: ./archive-wage-app-kotlin.apk
          retention-days: 30

  build_web:
    name: Build Web Package (Vite / PWA)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Upload Web Build & ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Web-Build-Dist
          path: |
            dist/
            build.zip
          retention-days: 30
