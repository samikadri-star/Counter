name: Build & Package App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Production Package & APK Ready Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web & PWA Package
        run: npm run build

      - name: Verify build artifacts
        run: |
          ls -la dist/
          ls -la build.zip

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: archive-app-build
          path: |
            dist/
            build.zip
          retention-days: 30
