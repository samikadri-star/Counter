<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4f46e5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3" />

  <!-- Archive Document & Folder Motif -->
  <g filter="url(#glow)">
    <!-- Back Folder Tab -->
    <path d="M 120 180 L 210 180 L 240 210 L 392 210 A 24 24 0 0 1 416 234 L 416 350 A 24 24 0 0 1 392 374 L 120 374 A 24 24 0 0 1 96 350 L 96 204 A 24 24 0 0 1 120 180 Z" fill="#1e293b" opacity="0.9" />
    
    <!-- Calculator / Sheet Panel -->
    <rect x="128" y="140" width="256" height="270" rx="28" fill="url(#brandGrad)" />
    
    <!-- Inner Screen Display -->
    <rect x="156" y="170" width="200" height="60" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
    
    <!-- Screen Text / Numbers (17 × N) -->
    <text x="336" y="210" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="28" text-anchor="end">17 × Σ</text>
    
    <!-- Calculator Keypad Grid / Archive slots -->
    <rect x="156" y="250" width="42" height="34" rx="8" fill="rgba(255,255,255,0.2)" />
    <rect x="208" y="250" width="42" height="34" rx="8" fill="rgba(255,255,255,0.2)" />
    <rect x="260" y="250" width="42" height="34" rx="8" fill="rgba(255,255,255,0.2)" />
    <rect x="312" y="250" width="44" height="34" rx="8" fill="url(#goldGrad)" />

    <rect x="156" y="296" width="42" height="34" rx="8" fill="rgba(255,255,255,0.2)" />
    <rect x="208" y="296" width="42" height="34" rx="8" fill="rgba(255,255,255,0.2)" />
    <rect x="260" y="296" width="42" height="34" rx="8" fill="rgba(255,255,255,0.2)" />
    <rect x="312" y="296" width="44" height="80" rx="10" fill="#10b981" />

    <rect x="156" y="342" width="94" height="34" rx="8" fill="rgba(255,255,255,0.2)" />
    <rect x="260" y="342" width="42" height="34" rx="8" fill="rgba(255,255,255,0.2)" />
  </g>
</svg>
